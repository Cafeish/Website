<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — Cafeish</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="logo-mark"><img class="logo-img" src="" alt="Cafeish" style="display:none; height:34px;">
      <span class="logo-fallback">cafeish<span class="dot">.</span></span></a>
    <ul class="nav-links">
      <li><a href="index.html" data-page="index.html">Story</a></li>
      <li><a href="menu.html" data-page="menu.html">Menu</a></li>
      <li><a href="about.html" data-page="about.html">About</a></li>
      <li><a href="journal.html" data-page="journal.html" class="active">Journal</a></li>
      <li><a href="waitlist.html" class="pill-btn">Get early access →</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</nav>

<header class="section-tight">
  <div class="wrap">
    <p class="eyebrow">Journal</p>
    <h1 style="font-size:clamp(30px,4vw,46px); margin-top:10px;" data-edit-key="journal-headline">Notes from the kitchen.</h1>
  </div>
</header>

<section style="padding-top:0;">
  <div class="wrap">
    <div id="featured-post" class="grid-2" style="margin-bottom:80px; align-items:center;"></div>
    <div class="grid-3" id="journal-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <div class="footer-col"><h4>Cafeish</h4><p>Pop-ups &amp; catering across St. Louis.</p></div>
      <div class="footer-col"><h4>Explore</h4>
        <a href="menu.html">Menu</a><a href="about.html">About</a><a href="journal.html">Journal</a><a href="waitlist.html">Early access</a>
      </div>
      <div class="footer-col"><h4>Connect</h4>
        <a href="order.html">Order &amp; contact</a><a href="reviews.html">Reviews</a>
      </div>
    </div>
    <hr class="rule">
    <p class="footer-bottom" style="margin-top:24px;">© 2026 Cafeish. St. Louis, MO.</p>
  </div>
</footer>

<script src="js/site-config.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/inline-edit.js"></script>
<script>
  const featured = JOURNAL_POSTS.find(p => p.featured) || JOURNAL_POSTS[0];
  const rest = JOURNAL_POSTS.filter(p => p.id !== featured.id);

  document.getElementById('featured-post').innerHTML = `
    <div style="height:340px; border-radius:6px; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px;">
      ${featured.img ? `<img src="${featured.img}" alt="${featured.title}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;">` : 'Photo coming'}
    </div>
    <div>
      <p class="eyebrow" style="margin-bottom:12px;">Featured</p>
      <h2 style="font-size:28px; margin-bottom:14px;">${featured.title}</h2>
      <p class="muted" style="margin-bottom:16px;">${featured.excerpt}</p>
      <p class="muted" style="font-size:13px;">${new Date(featured.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</p>
    </div>
  `;

  document.getElementById('journal-grid').innerHTML = rest.map(p => `
    <div class="card">
      <div style="height:150px; border-radius:4px; background:var(--nav); margin-bottom:16px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px;">
        ${p.img ? `<img src="${p.img}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">` : 'Photo coming'}
      </div>
      <h3 style="font-size:17px; margin-bottom:8px;">${p.title}</h3>
      <p class="muted" style="font-size:14px; margin-bottom:12px;">${p.excerpt}</p>
      <p class="muted" style="font-size:12px;">${new Date(p.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</p>
    </div>
  `).join('');
</script>
</body>
</html>
