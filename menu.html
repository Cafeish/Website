<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Cafeish</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="logo-mark"><span class="logo-fallback">cafeish<span class="dot">.</span></span></a>
    <ul class="nav-links">
      <li><a href="index.html" data-page="index.html">Story</a></li>
      <li><a href="menu.html" data-page="menu.html" class="active">Menu</a></li>
      <li><a href="about.html" data-page="about.html">About</a></li>
      <li><a href="journal.html" data-page="journal.html">Journal</a></li>
      <li><a href="waitlist.html" class="pill-btn">Get early access →</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</nav>

<header class="section-tight">
  <div class="wrap">
    <p class="eyebrow">Menu</p>
    <h1 style="font-size:clamp(30px,4vw,46px); margin-top:10px; max-width:640px;" data-edit-key="menu-headline">Full item list and prices are coming soon — this is a first look.</h1>
  </div>
</header>

<section style="padding-top:0;">
  <div class="wrap">
    <div id="filter-pills" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:40px;">
      <button class="btn btn-outline pill-active" data-filter="All">All</button>
      <button class="btn btn-outline" data-filter="Drinks">Drinks</button>
      <button class="btn btn-outline" data-filter="Bakes">Bakes</button>
      <button class="btn btn-outline" data-filter="Food">Food</button>
      <button class="btn btn-outline" data-filter="Cakes">Cakes</button>
    </div>
    <div class="grid-3" id="menu-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <div class="footer-col"><h4>Cafeish</h4><p>Pop-ups &amp; catering across St. Louis.</p></div>
      <div class="footer-col"><h4>Explore</h4>
        <a href="menu.html">Menu</a><a href="about.html">About</a><a href="journal.html">Journal</a><a href="waitlist.html">Early access</a>
      </div>
      <div class="footer-col"><h4>Connect</h4>
        <a href="order.html">Order &amp; contact</a><a href="reviews.html">Reviews</a>
      </div>
    </div>
    <hr class="rule">
    <p class="footer-bottom" style="margin-top:24px;">© 2026 Cafeish. St. Louis, MO.</p>
  </div>
</footer>

<script src="js/site-config.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/inline-edit.js"></script>
<script>
  let currentFilter = 'All';

  async function renderMenu() {
    const grid = document.getElementById('menu-grid');
    grid.innerHTML = `<p class="muted">Loading menu...</p>`;
    const items = (getAllMenuItems()).filter(i => currentFilter === 'All' || i.category === currentFilter);
    if (!items.length) {
      grid.innerHTML = `<p class="muted">No items in this category yet.</p>`;
      return;
    }
    grid.innerHTML = items.map(it => `
      <div class="card">
        <div style="height:170px; border-radius:4px; background:var(--nav); margin-bottom:18px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px;">
          ${it.img ? `<img src="${it.img}" alt="${it.name}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">` : 'Photo coming'}
        </div>
        <p class="eyebrow" style="margin-bottom:6px;">${it.category}</p>
        <h3 style="font-size:19px; margin-bottom:8px;">${it.name}</h3>
        <p class="muted" style="font-size:14px; margin-bottom:14px;">${it.desc || ''}</p>
        <p style="color:var(--gold); font-weight:700;">$${Number(it.price).toFixed(2)}</p>
      </div>
    `).join('');
  }

  document.querySelectorAll('#filter-pills button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#filter-pills button').forEach(b => b.classList.remove('pill-active'));
      btn.classList.add('pill-active');
      btn.style.borderColor = 'var(--gold)';
      document.querySelectorAll('#filter-pills button').forEach(b => { if (b !== btn) b.style.borderColor = ''; });
      currentFilter = btn.dataset.filter;
      renderMenu();
    });
  });

  renderMenu();
</script>
</body>
</html>
